<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sentiment Analyzer</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>Sentiment Analyzer</h1>

        <p class="subtitle">
            Enter some text and analyze its sentiment using TextBlob.
        </p>

        <form method="POST">

            <textarea
                name="text"
                placeholder="Enter your text here..."
                required>{{ text }}</textarea>

            <button type="submit">
                Analyze Sentiment
            </button>

        </form>

        {% if sentiment %}

        <div class="result">

            <h2>Analysis Result</h2>

            <p>
                <strong>Sentiment:</strong>
                <span class="sentiment">
                    {{ sentiment }}
                </span>
            </p>

            <p>
                <strong>Polarity:</strong>
                {{ "%.2f"|format(polarity) }}
            </p>

            <p>
                <strong>Subjectivity:</strong>
                {{ "%.2f"|format(subjectivity) }}
            </p>

        </div>

        {% endif %}

    </div>

</body>
</html>
